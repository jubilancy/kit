* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font-sans); }
.container { padding: 1rem 0; }
.search-wrap { margin-bottom: 1.25rem; position: relative; }
.search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--color-text-secondary); font-size: 16px; pointer-events: none; }
#search { width: 100%; padding: 8px 12px 8px 34px; }
.tabs { display: flex; gap: 6px; margin-bottom: 1rem; flex-wrap: wrap; }
.tab { padding: 5px 14px; font-size: 13px; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); cursor: pointer; background: transparent; color: var(--color-text-secondary); }
.tab.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); }
.count { font-size: 12px; color: var(--color-text-tertiary); margin-bottom: 0.75rem; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 8px; }
.item { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 10px 14px; display: flex; align-items: flex-start; gap: 10px; }
.item:hover { border-color: var(--color-border-secondary); }
.icon { font-size: 16px; color: var(--color-text-secondary); margin-top: 2px; flex-shrink: 0; }
.name { font-size: 13px; font-weight: 500; color: var(--color-text-primary); font-family: var(--font-mono); margin-bottom: 2px; }
.desc { font-size: 12px; color: var(--color-text-secondary); line-height: 1.5; }
.tag { display: inline-block; font-size: 10px; padding: 1px 7px; border-radius: var(--border-radius-md); margin-top: 4px; }
.tag-media { background: var(--color-background-info); color: var(--color-text-info); }
.tag-cli { background: var(--color-background-success); color: var(--color-text-success); }
.tag-lib { background: var(--color-background-secondary); color: var(--color-text-secondary); }
.tag-lang { background: var(--color-background-warning); color: var(--color-text-warning); }
.tag-cask { background: #EEEDFE; color: #3C3489; }
.hidden { display: none; }
</style>

<div class="container">

  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</div>

const tagLabel = {cli:"CLI",media:"Media",lib:"Library",lang:"Language",cask:"App"};
const tagClass = {cli:"tag-cli",media:"tag-media",lib:"tag-lib",lang:"tag-lang",cask:"tag-cask"};

let currentTab = "all";

function render(list) {
  const grid = document.getElementById("grid");
  const count = document.getElementById("count");
  count.textContent = list.length + " package" + (list.length !== 1 ? "s" : "");
  grid.innerHTML = list.map(p => `
    <div class="item">
      <i class="ti ${p.icon} icon" aria-hidden="true"></i>
      <div>
        <div class="name">${p.name}</div>
        <div class="desc">${p.desc}</div>
        <span class="tag ${tagClass[p.cat]}">${tagLabel[p.cat]}</span>
      </div>
    </div>
  `).join("");
}

function filter() {
  const q = document.getElementById("search").value.toLowerCase();
  const list = packages.filter(p =>
    (currentTab === "all" || p.cat === currentTab) &&
    (p.name.includes(q) || p.desc.toLowerCase().includes(q))
  );
  render(list);
}

function setTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  filter();
}

render(packages);
